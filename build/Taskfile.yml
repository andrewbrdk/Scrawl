version: '3'

tasks:
  go:mod:tidy:
    summary: Runs `go mod tidy`
    internal: true
    run: once
    cmds:
      - go mod tidy

  install:frontend:deps:
    summary: Install frontend dependencies
    run: once
    sources:
      - frontend/package.json
      - frontend/package-lock.json
    generates:
      - frontend/node_modules
    preconditions:
      - sh: npm version
        msg: "Looks like npm isn't installed. Npm is part of the Node installer: https://nodejs.org/en/download/"
    cmds:
      - npm install --prefix frontend

  generate:bindings:
    summary: Generates TS bindings (./frontend/bindings) for the bound ScrawlService
    run: once
    deps:
      - task: go:mod:tidy
    cmds:
      - wails3 generate bindings -f '-tags android' -clean=true -ts -i -d frontend/bindings
      - test -f frontend/bindings/scrawl/scrawlservice.ts
    # Bindings come from the Go AST, so no C compiler is needed. The android
    # tag pulls in cgo files that include <jni.h>, which only the NDK provides.
    env:
      CGO_ENABLED: 0

  build:frontend:
    label: build:frontend (DEV={{.DEV}})
    summary: Bundles the wails frontend into dist-wails (needs bindings/)
    # android:build and linux:build both depend on this; run once so bindings
    # aren't regenerated (-clean) while the bundler reads them.
    run: once
    sources:
      - frontend/*.ts
      - frontend/index.html
      - frontend/style.css
      - frontend/package.json
    generates:
      - dist-wails/**/*
    deps:
      - task: install:frontend:deps
      - task: generate:bindings
        vars:
          BUILD_FLAGS:
            ref: .BUILD_FLAGS
    cmds:
      - npm run dist:wails -q --prefix frontend
