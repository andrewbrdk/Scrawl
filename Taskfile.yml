version: '3'

vars:
  APP_NAME: "scrawl"
  BIN_DIR: "bin"

includes:
  common: ./build/Taskfile.yml
  android: ./build/android/Taskfile.yml

tasks:
  build:
    summary: Builds the Android application
    cmds:
      - task: android:build

  package:
    summary: Packages a production build of the application
    cmds:
      - task: android:package

  run:
    summary: Runs the application
    cmds:
      - task: android:run

  clean:
    summary: Removes everything ignored by git, except databases and dotfiles
    prompt: This deletes all git-ignored files except *.db and dotfiles. Continue?
    cmds:
      - git clean -fdX -e '!*.db' -e '!.*'
      - rm -rf .task
