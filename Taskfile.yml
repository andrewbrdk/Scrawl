version: '3'

vars:
  APP_NAME: "scrawl"
  BIN_DIR: "bin"

includes:
  common: ./build/Taskfile.yml
  android: ./build/android/Taskfile.yml

tasks:
  build:
    summary: Builds the Android application
    cmds:
      - task: android:build

  package:
    summary: Packages a production build of the application
    cmds:
      - task: android:package

  run:
    summary: Runs the application
    cmds:
      - task: android:run

  clean:
    summary: Removes build outputs and generated files (keeps node_modules)
    cmds:
      - rm -rf bin dist-web dist-wails bindings .task
      - task: android:clean
